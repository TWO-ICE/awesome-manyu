name: Refresh data

on:
  schedule:
    - cron: "0 1 * * 1" # 每周一 09:00 UTC+8：自动发现入库 + 刷新数据
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 渠道 1/2/3：姐妹清单 diff + GitHub 搜索 → 达标项目自动入库 data/projects.json
      - name: Discover and apply new projects
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/discover.py --apply > /tmp/report.md

      # 用最新数据源（含本周新增）刷新 README 全部表格与星数
      - name: Refresh tables
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/refresh.py

      - name: Commit if changed
        run: |
          git config user.name "manyu-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/projects.json README.md CHANGELOG.md
          if git diff --cached --quiet; then
            echo "本周无新增、无数据变化，跳过提交"
          else
            git commit -m "chore: weekly auto-update [skip ci]"
            git pull --rebase --autostash origin main
            git push
          fi
